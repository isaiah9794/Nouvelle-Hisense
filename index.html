<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIDAA Glass OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --dock-radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #080b10;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
    }

    /* Arrière-plan Paysage 4K */
    .layer-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: 1;
      transition: background-image 0.9s ease-in-out;
      transform: scale(1.01);
    }

    /* Date & Horloge fine Glassmorphism 2.0 */
    .clock-container {
      position: absolute;
      top: 13.5vh;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
      width: 100%;
      pointer-events: none;
    }

    .date-display {
      font-family: 'Inter', sans-serif;
      font-size: 1.55vw;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
      margin-bottom: -1.1vw;
      position: relative;
      z-index: 5;
    }

    .time-display {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 300;
      font-size: 17.5vw;
      line-height: 0.88;
      letter-spacing: 0.02em;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.90) 0%,
        rgba(255, 255, 255, 0.65) 55%,
        rgba(255, 255, 255, 0.35) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1.2px rgba(255, 255, 255, 0.42);
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.28));
    }

    /* Canvas de profondeur (relief devant l'horloge) */
    #fgCanvas {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      pointer-events: none;
      transform: scale(1.01);
    }

    /* Vignette douce en bas */
    .layer-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.12) 0%,
        rgba(0, 0, 0, 0.0) 45%,
        rgba(0, 0, 0, 0.42) 86%,
        rgba(0, 0, 0, 0.72) 100%
      );
      z-index: 4;
      pointer-events: none;
    }

    /* Dock des 7 applications officielles */
    .app-dock {
      position: absolute;
      bottom: 4.5vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.35vw;
      z-index: 10;
      padding: 10px 18px;
    }

    .app-card {
      width: 11.4vw;
      height: 6.6vw;
      min-width: 136px;
      min-height: 80px;
      border-radius: var(--dock-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.5);
      outline: none;
      overflow: hidden;
    }

    .app-card:focus, .app-card.focused, .app-card:hover {
      transform: translateY(-12px) scale(1.08);
      border: 3px solid #ffffff;
      box-shadow: 0 22px 42px rgba(0, 0, 0, 0.75), 0 0 26px rgba(255, 255, 255, 0.55);
      z-index: 12;
    }

    /* Arrière-plans officiels par tuile */
    .app-canal { background: #000000; }
    .app-youtube { background: #ffffff; }
    .app-netflix { background: #ffffff; }
    .app-prime { background: linear-gradient(180deg, #1b65f6 0%, #0f4cd1 100%); }
    .app-disney { background: radial-gradient(circle at 50% 115%, #0ad2d3 0%, #083c75 45%, #040c24 95%); }
    .app-nba { background: #1c2033; }
    .app-crunchyroll { background: #f47521; }

    .app-card img {
      max-width: 78%;
      max-height: 70%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <div id="bgLayer" class="layer-bg"></div>

  <div class="clock-container">
    <div id="dateDisplay" class="date-display">Mardi 3 novembre</div>
    <div id="timeDisplay" class="time-display">14:52</div>
  </div>

  <canvas id="fgCanvas"></canvas>
  <div class="layer-vignette"></div>

  <nav id="appDock" class="app-dock">
    <!-- 1. CANAL+ -->
    <button class="app-card app-canal" data-app="canalplus" tabindex="0" aria-label="CANAL+">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 60'><text x='50%' y='56%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='Arial, sans-serif' font-weight='900' font-size='42' letter-spacing='1'>CANAL+</text></svg>" alt="CANAL+">
    </button>

    <!-- 2. YouTube -->
    <button class="app-card app-youtube" data-app="youtube" tabindex="0" aria-label="YouTube">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 280 60'><g transform='translate(5, 11)'><rect width='54' height='38' rx='9' fill='%23FF0000'/><polygon points='22,11 22,27 36,19' fill='%23FFFFFF'/></g><text x='74' y='41' fill='%23212121' font-family='Arial, sans-serif' font-weight='800' font-size='34' letter-spacing='-1'>YouTube</text></svg>" alt="YouTube">
    </button>

    <!-- 3. NETFLIX -->
    <button class="app-card app-netflix" data-app="netflix" tabindex="0" aria-label="Netflix">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 280 80'><text x='50% ' y='57%' dominant-baseline='middle' text-anchor='middle' fill='%23E50914' font-family='Impact, sans-serif' font-weight='700' font-size='62' letter-spacing='3'>NETFLIX</text></svg>" alt="Netflix">
    </button>

    <!-- 4. Prime Video -->
    <button class="app-card app-prime" data-app="primevideo" tabindex="0" aria-label="Prime Video">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 110'><text x='50%' y='35' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='Arial, sans-serif' font-weight='800' font-size='30'>prime</text><text x='50%' y='68' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='Arial, sans-serif' font-weight='800' font-size='30'>video</text><path d='M 52 84 Q 110 108 166 84' fill='none' stroke='%23ffffff' stroke-width='5.5' stroke-linecap='round'/><path d='M 155 80 L 169 83 L 163 95' fill='none' stroke='%23ffffff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>" alt="Prime Video">
    </button>

    <!-- 5. Disney+ -->
    <button class="app-card app-disney" data-app="disneyplus" tabindex="0" aria-label="Disney+">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 110'><path d='M 38 56 Q 115 8 188 52' fill='none' stroke='%237ce8ff' stroke-width='3.2' stroke-linecap='round' opacity='0.9'/><circle cx='116' cy='28' r='2.8' fill='%23ffffff'/><text x='45%' y='74' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif' font-weight='bold' font-style='italic' font-size='42'>Disney</text><text x='192' y='72' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='Arial, sans-serif' font-weight='700' font-size='36'>+</text></svg>" alt="Disney+">
    </button>

    <!-- 6. NBA -->
    <button class="app-card app-nba" data-app="nba" tabindex="0" aria-label="NBA">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 160'><rect x='14' y='6' width='72' height='148' rx='14' fill='%23ffffff'/><path d='M 28 10 H 52 V 150 H 28 A 10 10 0 0 1 18 140 V 20 A 10 10 0 0 1 28 10 Z' fill='%2300539F'/><path d='M 52 10 H 72 A 10 10 0 0 1 82 20 V 140 A 10 10 0 0 1 72 150 H 52 V 10 Z' fill='%23D50032'/><circle cx='56' cy='26' r='6.5' fill='%23ffffff'/><path d='M 48 34 C 42 40, 38 52, 42 64 L 34 92 L 42 95 L 50 72 L 56 98 L 64 96 L 59 64 C 65 56, 68 46, 60 36 Z' fill='%23ffffff'/><circle cx='69' cy='64' r='6.5' fill='%23ffffff'/><text x='50' y='138' text-anchor='middle' fill='%23ffffff' font-family='Impact, sans-serif' font-weight='700' font-size='34' letter-spacing='1'>NBA</text></svg>" alt="NBA">
    </button>

    <!-- 7. Crunchyroll -->
    <button class="app-card app-crunchyroll" data-app="crunchyroll" tabindex="0" aria-label="Crunchyroll">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 115'><g transform='translate(120, 40)'><path d='M 0 -26 A 26 26 0 1 0 26 0 A 22 22 0 1 1 -4 -21' fill='%23ffffff'/><circle cx='4' cy='2' r='13' fill='%23f47521'/><circle cx='7' cy='4' r='9.5' fill='%23ffffff'/></g><text x='50%' y='95' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='Arial, sans-serif' font-weight='800' font-size='25' letter-spacing='-0.4'>Crunchyroll</text></svg>" alt="Crunchyroll">
    </button>
  </nav>

  <script>
    const APPS_CONFIG = {
      canalplus:   { appId: "canalplus",   url: "https://www.canalplus.com/" },
      youtube:     { appId: "youtube",     url: "https://www.youtube.com/tv" },
      netflix:     { appId: "netflix",     url: "https://www.netflix.com/title" },
      primevideo:  { appId: "amazon",      url: "https://www.primevideo.com/" },
      disneyplus:  { appId: "disneyplus",  url: "https://www.disneyplus.com/" },
      nba:         { appId: "nba",         url: "https://www.nba.com/watch" },
      crunchyroll: { appId: "crunchyroll", url: "https://www.crunchyroll.com/" }
    };

    // Les 15 paysages 4K sélectionnés (sans les 5 que vous avez retirés)
    const LANDSCAPES = [
      "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1505118380757-91f5f5632de0?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1531366936337-7c912a4589a7?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=2560&q=85",
      "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=2560&q=85"
    ];

    function renderDepthForeground(imageUrl) {
      const canvas = document.getElementById("fgCanvas");
      const ctx = canvas.getContext("2d");
      const w = (canvas.width = window.innerWidth);
      const h = (canvas.height = window.innerHeight);

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        ctx.clearRect(0, 0, w, h);
        const scale = Math.max(w / img.width, h / img.height);
        const drawW = img.width * scale;
        const drawH = img.height * scale;
        const offsetX = (w - drawW) / 2;
        const offsetY = (h - drawH) / 2;

        ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

        try {
          const imgData = ctx.getImageData(0, 0, w, h);
          const data = imgData.data;

          let skyLumaSum = 0;
          let count = 0;
          const sampleYStart = Math.floor(h * 0.12);
          const sampleYEnd = Math.floor(h * 0.22);
          const sampleXStart = Math.floor(w * 0.25);
          const sampleXEnd = Math.floor(w * 0.75);

          for (let y = sampleYStart; y < sampleYEnd; y += 4) {
            for (let x = sampleXStart; x < sampleXEnd; x += 8) {
              const i = (y * w + x) * 4;
              skyLumaSum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
              count++;
            }
          }
          const skyLuma = skyLumaSum / Math.max(1, count);
          const threshold = skyLuma * 0.76;

          const topCut = Math.floor(h * 0.23);
          const bottomFull = Math.floor(h * 0.52);

          for (let y = 0; y < bottomFull; y++) {
            for (let x = 0; x < w; x++) {
              const i = (y * w + x) * 4;
              if (y < topCut) {
                data[i + 3] = 0;
              } else {
                const luma = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                const diff = threshold - luma;
                if (diff > 0) {
                  const verticalFade = Math.min(1, (y - topCut) / (h * 0.06));
                  data[i + 3] = Math.min(255, diff * 9 * verticalFade);
                } else {
                  data[i + 3] = 0;
                }
              }
            }
          }
          ctx.putImageData(imgData, 0, 0);
        } catch (e) {
          ctx.clearRect(0, 0, w, h);
        }
      };
      img.src = imageUrl;
    }

    function applyNextLandscape() {
      let lastIndex = parseInt(localStorage.getItem("vidaa_bg_idx") || "-1", 10);
      let nextIndex = (lastIndex + 1) % LANDSCAPES.length;
      localStorage.setItem("vidaa_bg_idx", nextIndex.toString());

      const url = LANDSCAPES[nextIndex];
      document.getElementById("bgLayer").style.backgroundImage = `url('${url}')`;
      renderDepthForeground(url);
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("timeDisplay").textContent = `${hours}:${minutes}`;

      const options = { weekday: "long", day: "numeric", month: "long" };
      let dateStr = now.toLocaleDateString("fr-FR", options);
      dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
      document.getElementById("dateDisplay").textContent = dateStr;
    }

    function launchVidaaApp(appKey) {
      const app = APPS_CONFIG[appKey];
      if (!app) return;
      try {
        if (typeof Hisense_LaunchApp === "function") {
          Hisense_LaunchApp(app.appId, app.url);
          return;
        }
      } catch (e) {}
      window.location.href = app.url;
    }

    const cards = Array.from(document.querySelectorAll(".app-card"));
    let currentFocusIndex = 0;

    function updateFocus() {
      cards.forEach(c => c.classList.remove("focused"));
      const target = cards[currentFocusIndex];
      if (target) {
        target.focus();
        target.classList.add("focused");
      }
    }

    cards.forEach((card, idx) => {
      card.addEventListener("click", () => {
        currentFocusIndex = idx;
        updateFocus();
        launchVidaaApp(card.dataset.app);
      });
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") {
        currentFocusIndex = (currentFocusIndex + 1) % cards.length;
        updateFocus();
      } else if (e.key === "ArrowLeft") {
        currentFocusIndex = (currentFocusIndex - 1 + cards.length) % cards.length;
        updateFocus();
      } else if (e.key === "Enter") {
        e.preventDefault();
        launchVidaaApp(cards[currentFocusIndex].dataset.app);
      }
    });

    applyNextLandscape();
    updateClock();
    setInterval(updateClock, 10000);
    window.onload = () => updateFocus();
  </script>
</body>
</html>
